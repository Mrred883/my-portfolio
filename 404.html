<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Access Denied | Chris O. Agudosi</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Sora:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    *{margin:0;box-sizing:border-box}
    body{font-family:'Sora',sans-serif;background:#070a10;color:#e6edf3;min-height:100vh;display:grid;place-items:center;text-align:center;padding:2rem;
      background-image:linear-gradient(rgba(46,230,197,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(46,230,197,.04) 1px,transparent 1px);background-size:48px 48px}
    .code{font-family:'JetBrains Mono',monospace;font-size:clamp(4rem,18vw,9rem);font-weight:700;line-height:1;
      background:linear-gradient(120deg,#2ee6c5,#38bdf8);-webkit-background-clip:text;background-clip:text;color:transparent}
    h1{font-size:clamp(1.2rem,4vw,1.8rem);margin:1rem 0 .5rem}
    p{color:#9bb0c0;font-family:'JetBrains Mono',monospace;font-size:.9rem;margin-bottom:2rem}
    a{display:inline-flex;align-items:center;gap:.5rem;font-family:'JetBrains Mono',monospace;font-weight:700;
      text-decoration:none;color:#070a10;background:linear-gradient(135deg,#2ee6c5,#38bdf8);padding:.85rem 1.6rem;border-radius:10px;
      box-shadow:0 8px 24px -8px rgba(46,230,197,.6);transition:transform .2s}
    a:hover{transform:translateY(-2px)}
    .blink{animation:b 1s steps(1) infinite;color:#2ee6c5}@keyframes b{50%{opacity:0}}
  </style>
</head>
<body>
  <main>
    <div class="code">404</div>
    <h1>// access_denied: route not found</h1>
    <p>$ The page you requested could not be located<span class="blink">_</span></p>
    <a href="/">⟵ return to base</a>
  </main>
</body>
</html>
